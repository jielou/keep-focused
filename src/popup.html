<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keep Focused</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="popup-brand">
          <img src="../icons/keep_focused_icon.png" alt="">
          <div>
            <p>Keep Focused</p>
            <h1 id="statusText">Blocking is on</h1>
          </div>
        </div>
      </header>

      <label class="switch-row">
        <span>Enable blocking</span>
        <input id="enabled" type="checkbox">
      </label>

      <div class="stats">
        <span id="ruleCount">0 rules</span>
        <span id="sessionWindow">15 min sessions</span>
      </div>

      <div id="focusPanel" class="focus-panel hidden">
        <div class="focus-info">
          <span class="focus-dot" aria-hidden="true"></span>
          <div>
            <p class="focus-label">Focused on</p>
            <p id="focusDomain" class="focus-domain">—</p>
          </div>
        </div>
        <button id="exitFocus" type="button" class="secondary">Exit focus</button>
      </div>

      <button id="focusCurrent" type="button">Focus current page</button>
      <button id="openOptions" type="button" class="secondary">Open settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
